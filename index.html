<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark2932's Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }
        
        .nav-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        
        .nav-link {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .nav-link.primary {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border: none;
        }
        
        .nav-link.primary:hover {
            background: linear-gradient(135deg, #00b8e6 0%, #2e6bc4 100%);
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .feature-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }
        
        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .feature-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #00d2ff;
        }
        
        .feature-desc {
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        
        footer {
            margin-top: 3rem;
            padding: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .nav-links {
                flex-direction: column;
                align-items: center;
            }
            
            .nav-link {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dark2932's Blog</h1>
        <p class="subtitle">欢迎来到我的个人博客，这里记录了我的技术探索与学习笔记</p>
        
        <div class="nav-links">
            <a href="docs.html" class="nav-link primary">📚 文档中心</a>
            <a href="https://github.com/Dark2932" class="nav-link" target="_blank">🐙 GitHub</a>
        </div>
        
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">🎮</div>
                <div class="feature-title">Minecraft 模组</div>
                <div class="feature-desc">Architectury 多平台模组开发指南</div>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">💻</div>
                <div class="feature-title">技术笔记</div>
                <div class="feature-desc">编程学习过程中的经验总结</div>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">🛠️</div>
                <div class="feature-title">工具分享</div>
                <div class="feature-desc">实用开发工具和资源推荐</div>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Dark2932. Hosted on GitHub Pages.</p>
        </footer>
    </div>
</body>
</html>
